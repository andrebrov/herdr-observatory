<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Herdr Observatory</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f8;
        --panel: #fff;
        --sidebar: #eceef1;
        --line: #dfe3e8;
        --text: #202932;
        --muted: #65717e;
        --accent: #367c73;
        --accent-bg: #e5f2ee;
        --amber: #93611c;
        --amber-bg: #fff3df;
        --red: #ad4e51;
        --red-bg: #faecec;
        --blue: #446aab;
        --blue-bg: #eaf0fa;
        --shadow: 0 12px 45px #172a3b0a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #111518;
          --panel: #191f23;
          --sidebar: #151a1e;
          --line: #2a333a;
          --text: #e7ecee;
          --muted: #9aa7b1;
          --accent: #8dc8b5;
          --accent-bg: #203c34;
          --amber: #e1bc7c;
          --amber-bg: #3c3021;
          --red: #e4a0a0;
          --red-bg: #38272b;
          --blue: #a3bde7;
          --blue-bg: #273447;
          --shadow: 0 12px 45px #0002;
        }
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #111518;
        --panel: #191f23;
        --sidebar: #151a1e;
        --line: #2a333a;
        --text: #e7ecee;
        --muted: #9aa7b1;
        --accent: #8dc8b5;
        --accent-bg: #203c34;
        --amber: #e1bc7c;
        --amber-bg: #3c3021;
        --red: #e4a0a0;
        --red-bg: #38272b;
        --blue: #a3bde7;
        --blue-bg: #273447;
        --shadow: 0 12px 45px #0002;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        appearance: none;
        -webkit-appearance: none;
        background: none;
        border: 0;
      }
      button:hover {
        background: var(--accent-bg);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      a {
        color: var(--accent);
      }
      .app {
        display: grid;
        grid-template-columns: 222px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        padding: 32px 18px 20px;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        display: flex;
        gap: 11px;
        align-items: center;
        margin: 4px 10px 38px;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        background: var(--text);
        color: var(--bg);
        border-radius: 10px;
        font-size: 25px;
        font-weight: 300;
      }
      .brand strong {
        display: block;
        font-size: 15px;
        letter-spacing: -0.3px;
      }
      .brand small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
        letter-spacing: 1.3px;
        text-transform: uppercase;
      }
      .label {
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
        display: block;
        margin: 0 10px 10px;
      }
      .selector {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px;
        width: 100%;
        margin-bottom: 12px;
        font-size: 12px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-top: 25px;
      }
      .nav button {
        text-align: left;
        padding: 11px 12px;
        border-radius: 8px;
        color: var(--muted);
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .nav button[aria-current="page"] {
        background: var(--panel);
        box-shadow: 0 1px 5px #0001;
        color: var(--text);
        font-weight: 600;
      }
      .nav .icon {
        font-size: 17px;
        width: 18px;
      }
      .nav kbd {
        margin-left: auto;
        opacity: 0.6;
        font-size: 10px;
      }
      .sidebar-bottom {
        margin-top: auto;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
        padding: 16px 10px 0;
      }
      .read-only {
        color: var(--accent);
        font-weight: 600;
        display: block;
        margin-bottom: 7px;
      }
      .shell {
        min-width: 0;
      }
      .toolbar {
        height: 66px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        padding: 0 32px;
        gap: 14px;
      }
      .breadcrumb {
        font-size: 12px;
        color: var(--muted);
      }
      .breadcrumb b {
        color: var(--text);
        font-weight: 550;
      }
      .toolbar input {
        margin-left: auto;
        width: 210px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 10px;
        font-size: 11px;
      }
      .toolbar select {
        background: none;
        border: 0;
        font-size: 11px;
      }
      .page {
        padding: 30px 32px 40px;
        max-width: 1800px;
        margin: auto;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 1.7px;
        text-transform: uppercase;
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }
      .hero h1 {
        font-weight: 620;
        font-size: 30px;
        letter-spacing: -1.15px;
        margin: 9px 0;
      }
      .hero p {
        color: var(--muted);
        margin: 0;
        font-size: 12px;
      }
      .live-status {
        text-align: right;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.8;
        max-width: 270px;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 100%;
        background: var(--accent);
        margin-right: 7px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 13px;
        margin-bottom: 26px;
      }
      .stat {
        padding: 18px 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 11px;
        box-shadow: var(--shadow);
      }
      .stat .value {
        font-size: 28px;
        letter-spacing: -1px;
        font-weight: 550;
        margin: 9px 0 5px;
      }
      .stat .caption {
        color: var(--muted);
        font-size: 11px;
      }
      .stat .top {
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .stat .symbol {
        color: var(--muted);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 290px;
        gap: 22px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 13px;
        gap: 10px;
      }
      .section-head h2 {
        font-size: 15px;
        letter-spacing: -0.3px;
        font-weight: 620;
        margin: 0;
      }
      .section-head span {
        font-size: 11px;
        color: var(--muted);
      }
      .section {
        margin-bottom: 26px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 11px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .agent-row {
        display: grid;
        grid-template-columns: 35px minmax(0, 1fr) 85px;
        gap: 12px;
        padding: 15px 17px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .agent-row:last-child {
        border-bottom: 0;
      }
      .avatar {
        height: 33px;
        width: 33px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--blue-bg);
        color: var(--blue);
        font-weight: 600;
        font-size: 12px;
      }
      .agent-name {
        font-weight: 600;
        font-size: 12px;
      }
      .agent-role {
        font-weight: 400;
        color: var(--muted);
        margin-left: 7px;
        font-size: 10px;
      }
      .agent-task {
        color: var(--muted);
        font-size: 11px;
        margin: 5px 0 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .agent-meta {
        font-size: 10px;
        color: var(--muted);
      }
      .agent-end {
        text-align: right;
      }
      .focus {
        font-size: 10px;
        color: var(--accent);
        padding: 5px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        margin-top: 7px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        font-weight: 550;
        border-radius: 5px;
        padding: 4px 7px;
        background: var(--sidebar);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.running,
      .pill.working,
      .pill.accepted {
        color: var(--accent);
        background: var(--accent-bg);
      }
      .pill.blocked {
        color: var(--red);
        background: var(--red-bg);
      }
      .pill.awaiting,
      .pill.warning {
        color: var(--amber);
        background: var(--amber-bg);
      }
      .pill.queued {
        color: var(--blue);
        background: var(--blue-bg);
      }
      .board {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }
      .column {
        background: var(--sidebar);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px 7px;
        min-height: 175px;
      }
      .column-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
        font-size: 9px;
        font-weight: 650;
        letter-spacing: 0.15px;
        min-height: 24px;
        margin-bottom: 7px;
      }
      .count {
        color: var(--muted);
        font-weight: 400;
      }
      .task {
        display: block;
        text-align: left;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 11px 9px;
        margin-bottom: 7px;
        width: 100%;
        min-height: 94px;
      }
      .task-title {
        font-size: 11px;
        font-weight: 550;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .task-worker {
        font-size: 9px;
        color: var(--muted);
        margin-top: 10px;
      }
      .task-foot {
        font-size: 9px;
        color: var(--accent);
        margin-top: 5px;
      }
      .empty {
        padding: 18px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
      }
      .column .empty {
        padding: 10px 2px;
        font-size: 9px;
      }
      .attention-card {
        border-bottom: 1px solid var(--line);
        padding: 17px;
      }
      .attention-card:last-child {
        border-bottom: 0;
      }
      .attention-card h3 {
        font-size: 12px;
        font-weight: 600;
        line-height: 1.5;
        margin: 10px 0 7px;
      }
      .attention-card p {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.65;
        margin: 0 0 9px;
      }
      .attention-action {
        font-size: 10px;
        line-height: 1.5;
        color: var(--amber);
      }
      .panel-footer {
        font-size: 10px;
        color: var(--muted);
        padding: 12px 17px;
        background: var(--sidebar);
        line-height: 1.6;
      }
      .evidence-row {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 11px;
        padding: 13px 16px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      .evidence-row:last-child {
        border-bottom: 0;
      }
      .file-icon {
        color: var(--muted);
        font-size: 18px;
      }
      .evidence-name {
        display: block;
        font-size: 11px;
        font-weight: 550;
        overflow-wrap: anywhere;
      }
      .evidence-meta {
        display: block;
        font-size: 9px;
        color: var(--muted);
        margin-top: 5px;
      }
      .timeline {
        padding: 5px 17px;
      }
      .event {
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr) 65px;
        gap: 12px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        align-items: start;
      }
      .event:last-child {
        border-bottom: 0;
      }
      .event-dot {
        width: 6px;
        height: 6px;
        border-radius: 100%;
        background: var(--muted);
        margin-top: 5px;
      }
      .event-dot.decision {
        background: var(--accent);
      }
      .event-dot.attention {
        background: var(--amber);
      }
      .event-title {
        font-size: 11px;
        font-weight: 550;
      }
      .event-detail {
        font-size: 10px;
        color: var(--muted);
        margin-top: 5px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .event-time {
        font-size: 9px;
        color: var(--muted);
        text-align: right;
      }
      .watcher {
        display: flex;
        gap: 10px;
        padding: 16px;
        align-items: start;
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
      }
      .watcher b {
        font-weight: 550;
        color: var(--text);
        display: block;
        margin-bottom: 5px;
      }
      .source-row {
        padding: 15px 17px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        line-height: 1.8;
      }
      .source-path {
        color: var(--muted);
        font:
          10px ui-monospace,
          SFMono-Regular,
          monospace;
        overflow-wrap: anywhere;
        margin: 6px 0;
      }
      .diagnostic {
        color: var(--amber);
        font-size: 11px;
        line-height: 1.6;
      }
      .notice {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 20px;
        color: var(--amber);
        font-size: 11px;
        line-height: 1.6;
      }
      .footer {
        color: var(--muted);
        font-size: 10px;
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
        gap: 15px;
      }
      .drawer {
        position: fixed;
        inset: 66px 0 0 auto;
        width: min(650px, 90vw);
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -15px 0 60px #0002;
        z-index: 10;
        display: flex;
        flex-direction: column;
      }
      .drawer[hidden] {
        display: none;
      }
      .drawer-head {
        padding: 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: start;
        gap: 15px;
      }
      .drawer-head h2 {
        font-size: 18px;
        margin: 0 0 9px;
        overflow-wrap: anywhere;
      }
      .drawer-head button {
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
      }
      .drawer-body {
        padding: 24px;
        overflow: auto;
        line-height: 1.7;
        flex: 1;
      }
      .drawer-body pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12px/1.8 ui-monospace,
          SFMono-Regular,
          monospace;
      }
      .drawer-body img {
        max-width: 100%;
        border-radius: 8px;
      }
      .drawer-body h3 {
        font-size: 14px;
      }
      .drawer-bottom {
        border-top: 1px solid var(--line);
        padding: 16px 24px;
        display: flex;
        gap: 10px;
      }
      .primary {
        background: var(--accent-bg);
        color: var(--accent);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 11px;
      }
      .detail-label {
        color: var(--muted);
        font-size: 11px;
        margin: 14px 0 5px;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        background: var(--text);
        color: var(--bg);
        padding: 12px 20px;
        border-radius: 9px;
        max-width: 80vw;
        font-size: 12px;
      }
      .toast:empty {
        display: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
      @media (max-width: 1200px) {
        .page {
          padding: 25px 22px;
        }
        .layout {
          grid-template-columns: minmax(0, 1fr) 250px;
          gap: 16px;
        }
        .app {
          grid-template-columns: 190px minmax(0, 1fr);
        }
        .sidebar {
          padding-left: 12px;
          padding-right: 12px;
        }
        .board {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .hero {
          align-items: start;
        }
        .hero h1 {
          font-size: 25px;
        }
        .toolbar {
          padding: 0 20px;
        }
        .toolbar input {
          width: 150px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: background 0.15s;
        }
      }
      .markdown {
        font-size: 13px;
        line-height: 1.8;
        overflow-wrap: anywhere;
        color: var(--text);
      }
      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4,
      .markdown h5,
      .markdown h6 {
        line-height: 1.35;
        letter-spacing: -0.4px;
        margin: 1.5em 0 0.65em;
        font-weight: 650;
      }
      .markdown h1 {
        font-size: 26px;
      }
      .markdown h2 {
        font-size: 20px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }
      .markdown h3 {
        font-size: 16px;
      }
      .markdown h4,
      .markdown h5,
      .markdown h6 {
        font-size: 13px;
      }
      .markdown > :first-child {
        margin-top: 16px;
      }
      .markdown p {
        margin: 0.7em 0 1em;
      }
      .markdown ul,
      .markdown ol {
        padding-left: 24px;
        margin: 0.7em 0 1em;
      }
      .markdown li {
        margin: 0.3em 0;
      }
      .markdown li p {
        margin: 0.3em 0;
      }
      .markdown blockquote {
        border-left: 3px solid var(--accent);
        margin: 16px 0;
        padding: 4px 16px;
        color: var(--muted);
        background: var(--accent-bg);
        border-radius: 0 6px 6px 0;
      }
      .markdown code {
        font:
          11px/1.7 ui-monospace,
          SFMono-Regular,
          monospace;
        background: var(--sidebar);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 5px;
      }
      .markdown pre {
        position: relative;
        background: var(--sidebar);
        border: 1px solid var(--line);
        padding: 16px;
        border-radius: 8px;
        overflow: auto;
        white-space: pre;
        margin: 16px 0;
        overflow-wrap: normal;
      }
      .markdown pre[data-language] {
        padding-top: 34px;
      }
      .markdown pre[data-language]::before {
        content: attr(data-language);
        position: absolute;
        top: 9px;
        left: 16px;
        color: var(--muted);
        font:
          10px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        letter-spacing: 0.5px;
      }
      .markdown pre code {
        padding: 0;
        border: 0;
        background: none;
        font-size: 11px;
      }
      .markdown hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 24px 0;
      }
      .markdown-table {
        overflow-x: auto;
        margin: 16px 0;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .markdown table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      .markdown th,
      .markdown td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

        background: var(--sidebar);

      }

        border-bottom: 0;

        text-align: center;

      .markdown .align-right {
        text-align: right;

        list-style: none;

      .markdown-toolbar button[aria-pressed="false"] {
        background: transparent;

      }
      /* Star Trek LCARS themes: one frame, eleven palettes (lcars-<palette>).
         Each palette has seven slots; --slot-on is black or white by WCAG contrast.
         Local fonts only (CSP font-src 'none'). */
      :root[data-theme^="lcars"] {
        color-scheme: dark;
        --bg: #000;
        --panel: #0b0b12;
        --sidebar: #000;
        --line: #33334d;
        --text: #f3e3c3;
        --muted: #b9a7d6;
        --accent: var(--lo);
        --accent-bg: #2b1a00;
        --amber: var(--lg);
        --amber-bg: #3a2a0d;
        --red: #ff7a7a;
        --red-bg: #3a1414;
        --blue: var(--lb);
        --blue-bg: #1a2140;
        --shadow: none;
      }
      /* Body text stays regular width; only headings and bars use condensed type. */
      :root[data-theme^="lcars"]
        :is(
          h1,
          h2,
          .eyebrow,
          .nav button,
          .column-title,
          .section-head,
          .stat .value
        ) {
        font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
        font-stretch: condensed;
        text-transform: uppercase;

  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Workspace navigation">
        <div class="brand">
          <div class="mark" aria-hidden="true">◉</div>
          <div><strong>Herdr</strong><small>Observatory</small></div>

        <label class="label" for="project">Project</label
        ><select id="project" class="selector"></select
        ><label class="label" for="session">Session</label
        ><select id="session" class="selector"></select>
        <nav class="nav" aria-label="Dashboard views">
          <button data-view="overview" aria-current="page">
            <span class="icon" aria-hidden="true">▦</span> Overview
            <kbd>1</kbd></button
          ><button data-view="agents">
            <span class="icon" aria-hidden="true">◎</span> Agents
            <kbd>2</kbd></button
          ><button data-view="activity">

            <kbd>3</kbd></button
          ><button data-view="evidence">

          ><button data-view="sources">

          </button>
        </nav>
        <div class="sidebar-bottom">
          <span class="read-only">◈ &nbsp; Observation mode</span>Every claim
          has a source.<br />Every decision keeps its evidence.<br /><span
            id="mode"
          ></span>
        </div>
      </aside>
      <div class="shell">
        <header class="toolbar">
          <span class="breadcrumb"
            >Workspace &nbsp; / &nbsp; <b id="crumb">Overview</b></span
          ><label class="sr-only" for="search">Filter dashboard</label
          ><input
            id="search"
            placeholder="Search work, agents, events…  /"
            type="search"
          /><label class="sr-only" for="theme">Appearance</label
          ><select id="theme">
            <option value="system">◐ System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <optgroup label="Star Trek">
              <option value="lcars-movie">Movie Era</option>
              <option value="lcars-lcars">LCARS</option>
              <option value="lcars-tng">TNG</option>
              <option value="lcars-blue">Blue Alert</option>
              <option value="lcars-grey">Grey Alert</option>
              <option value="lcars-yellow">Yellow Alert</option>
              <option value="lcars-red">Red Alert</option>
              <option value="lcars-sto">Star Trek Online</option>

          ><button id="refresh" class="primary" title="Refresh observations">
            ↻

    <aside
      class="drawer"
      id="drawer"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawer-title"
      tabindex="-1"
    >
      <div class="drawer-head">
        <div>
          <h2 id="drawer-title"></h2>
          <div id="drawer-subtitle" class="source-path"></div>
        </div>
        <button id="close" aria-label="Close evidence viewer">✕</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
      <div id="drawer-bottom" class="drawer-bottom"></div>
    </aside>
    <div class="toast" role="status" id="toast"></div>
    <div class="sr-only" role="status" id="connection"></div>
    <!-- LOCAL_VENDOR -->
    <script>
      (() => {
        "use strict";
        let data = null,
          view = "overview",
          query = "",
          selectedEvidence = null,
          priorFocus = null,
          toastTimer;
        const $ = (id) => document.getElementById(id);
        const node = (tag, cls, text) => {
          const n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text !== undefined) n.textContent = String(text);
          return n;
        };
        const send = (message) => {
          if (window.glimpse) window.glimpse.send(message);
        };
        const short = (path) =>
          String(path).split("/").filter(Boolean).at(-1) || path;
        const age = (at) => {
          if (!at) return "unknown";
          const n = Date.parse(data.generatedAt) - Date.parse(at);
          if (!Number.isFinite(n) || n < -5000) return "unknown";
          return n < 60000
            ? "just now"
            : n < 3600000
              ? Math.floor(n / 60000) + "m ago"
              : n < 86400000
                ? Math.floor(n / 3600000) + "h ago"
                : Math.floor(n / 86400000) + "d ago";
        };
        const elapsed = (at) => {
          if (!at) return "elapsed unknown";
          const n = Date.parse(data.generatedAt) - Date.parse(at);
          return n < 0
            ? "elapsed unknown"
            : n < 3600000
              ? Math.floor(n / 60000) + "m since dispatch"
              : Math.floor(n / 3600000) + "h since dispatch";
        };
        const matches = (...texts) =>
          !query || texts.join(" ").toLowerCase().includes(query);
        const pill = (text, cls) => node("span", "pill " + (cls || text), text);
        const button = (text, cls, fn) => {
          const b = node("button", cls, text);
          b.onclick = fn;
          return b;
        };
        function section(title, subtitle, content) {
          const s = node("section", "section"),
            h = node("div", "section-head");
          h.append(node("h2", "", title), node("span", "", subtitle));
          s.append(h, content);
          return s;
        }
        function empty(text) {
          return node("div", "empty", text);
        }
        function showDrawer(title, subtitle) {
          priorFocus = document.activeElement;
          $("drawer-title").textContent = title;
          $("drawer-subtitle").textContent = subtitle;
          $("drawer-body").replaceChildren();
          $("drawer-bottom").replaceChildren();
          $("drawer").hidden = false;
          document.querySelector(".app").inert = true;
          $("close").focus();
        }
        function closeDrawer() {
          $("drawer").hidden = true;
          document.querySelector(".app").inert = false;
          selectedEvidence = null;
          if (priorFocus?.isConnected) priorFocus.focus();
          else $("search").focus();
        }
        function showTask(t) {
          selectedEvidence = null;
          showDrawer(t.title, t.id + " · " + t.source);
          const body = $("drawer-body");
          body.append(
            pill(t.stage, t.stage.split(" ")[0]),
            node("h3", "", t.agent + " · " + t.role),
            node("p", "", t.assessment),
            node("p", "source-path", "Recorded " + t.at),
          );
          if (t.head)
            body.append(
              node("div", "detail-label", "Recorded commit reference"),
              node("code", "source-path", t.head),
            );
          body.append(node("h3", "", "Evidence"));
          const list = data.evidence.filter((e) => t.evidence.includes(e.id));
          for (const e of list) body.append(evidenceButton(e, "drawer"));
          if (!list.length) body.append(empty("No bound evidence available."));
        }
        function markdownView(nodes) {
          const article = node("article", "markdown");
          const allowed = new Set([
            "p",
            "h1",
            "h2",
            "h3",
            "h4",
            "h5",
            "h6",
            "strong",
            "em",
            "s",
            "blockquote",
            "ul",
            "ol",
            "li",
            "pre",
            "code",
            "hr",
            "br",
            "table",
            "thead",
            "tbody",
            "tr",
            "th",
            "td",
            "span",
          ]);
          function append(parent, items) {
            for (const item of items) {
              if (item.kind === "text") {
                parent.append(document.createTextNode(item.text));
                continue;
              }
              if (item.kind !== "element" || !allowed.has(item.tag)) continue;
              const el = node(item.tag);
              if (item.start && item.tag === "ol") el.start = item.start;
              if (["left", "center", "right"].includes(item.align))
                el.classList.add("align-" + item.align);
              if (item.language && item.tag === "pre")
                el.dataset.language = item.language;
              if (typeof item.checked === "boolean" && item.tag === "li") {
                el.classList.add("markdown-task");
                const check = node(
                  "span",
                  "task-check",
                  item.checked ? "☑" : "☐",
                );
                check.setAttribute("role", "img");
                check.setAttribute(
                  "aria-label",
                  item.checked ? "Completed task" : "Open task",
                );
                el.append(check);
              }
              if (item.reference !== undefined) {
                const evidence = data.evidence.find(
                  (e) => e.id === item.evidenceId,
                );
                if (evidence) {
                  const b = button("", "markdown-evidence-link", () =>
                    showEvidence(evidence),
                  );
                  append(b, item.children);
                  b.title = "Open indexed evidence: " + evidence.path;
                  el.append(b);
                } else {
                  el.classList.add("markdown-reference");
                  append(el, item.children);
                  el.append(
                    node(
                      "span",
                      "markdown-reference-url",
                      " (" + item.reference + ")",
                    ),
                  );
                }
              } else append(el, item.children);
              if (item.tag === "table") {
                const wrap = node("div", "markdown-table");
                wrap.tabIndex = 0;
                wrap.setAttribute("role", "region");
                wrap.setAttribute("aria-label", "Report table");
                wrap.append(el);
                parent.append(wrap);
              } else parent.append(el);
            }
          }
          append(article, nodes);
          return article;
        }
        function showEvidence(e) {
          selectedEvidence = e.id;
          showDrawer(e.title, e.path);
          $("drawer-body").append(
            pill(
              e.integrity,
              e.integrity === "matched" ? "accepted" : "warning",
            ),
            node(
              "p",
              "source-path",
              e.sha256
                ? "Recorded SHA-256: " + e.sha256
                : "No digest bound to this artifact.",
            ),
            empty("Reading local evidence…"),
          );
          $("drawer-bottom").append(
            button("Open local file ↗", "primary", () =>
              send({ action: "openEvidence", id: e.id }),
            ),
          );
          send({ action: "readEvidence", id: e.id });
        }
        function evidenceButton(e, scope = "library") {
          const b = button("", "evidence-row", () => showEvidence(e)),
            text = node("span");
          text.append(
            node("span", "evidence-name", e.title),
            node(
              "span",
              "evidence-meta",
              e.kind.toUpperCase() + " · " + e.integrity,
            ),
          );
          b.id = scope + "-evidence-" + e.id;
          b.append(node("span", "file-icon", "▤"), text);
          return b;
        }
        function agentsPanel() {
          const panel = node("div", "panel"),
            list = data.agents.filter((a) =>
              matches(a.name, a.role, a.task, a.activity),
            );
          for (const a of list) {
            const row = node("div", "agent-row"),
              info = node("div"),
              end = node("div", "agent-end");
            const title = node("div", "agent-name", a.name);
            title.append(node("span", "agent-role", a.role));
            info.append(
              title,
              node("div", "agent-task", a.task),
              node(
                "div",
                "agent-meta",
                elapsed(a.since) +
                  " · " +
                  a.freshness +
                  " · seen " +
                  age(a.lastObserved),
              ),
            );
            end.append(pill(a.activity));
            if (a.pane) {
              const b = button("Focus pane ↗", "focus", () =>
                send({ action: "focus", id: a.id }),
              );
              b.id = "focus-" + a.id;
              b.disabled = !a.focusable;
              b.title = a.focusable
                ? "Explicitly focus " + a.pane + " (marks completion seen)"
                : "No correlated live pane; focus unavailable";
              end.append(b);
            }
            row.append(
              node("div", "avatar", a.name.slice(0, 2).toUpperCase()),
              info,
              end,
            );
            row.id = "agent-" + a.id;
            row.title =
              a.source + "\nLast observation: " + (a.lastObserved || "unknown");
            panel.append(row);
          }
          if (!list.length)
            panel.append(
              empty(
                "No agents observed for this project. Missing state is shown in Sources.",
              ),
            );
          return panel;
        }
        function board() {
          const board = node("div", "board");
          for (const stage of [
            "queued",
            "running",
            "awaiting verification",
            "blocked",
            "accepted",
          ]) {
            const tasks = data.tasks.filter(
              (t) =>
                t.stage === stage && matches(t.title, t.agent, t.role, t.stage),
            );
            const col = node("div", "column"),
              head = node("div", "column-title");
            head.append(
              node(
                "span",
                "",
                stage === "awaiting verification"
                  ? "Verification"
                  : stage[0].toUpperCase() + stage.slice(1),
              ),
              node("span", "count", tasks.length),
            );
            col.append(head);
            for (const t of tasks) {
              const b = button("", "task", () => showTask(t));
              b.id = "task-" + t.id;
              b.append(
                node("div", "task-title", t.title),
                node("div", "task-worker", t.agent + " · " + t.role),
                node(
                  "div",
                  "task-foot",
                  stage === "accepted"
                    ? "✓ Recorded acceptance"
                    : t.evidence.length + " evidence",
                ),
              );
              col.append(b);
            }
            if (!tasks.length) col.append(empty("No work here"));
            board.append(col);
          }
          return board;
        }
        function attentionPanel() {
          const panel = node("div", "panel");
          const list = data.attention.filter((a) =>
            matches(a.title, a.context, a.task),
          );
          for (const a of list) {
            const card = node("div", "attention-card");
            card.append(
              pill(a.kind, a.kind === "blocker" ? "blocked" : "warning"),
              node("h3", "", a.title),
              node("p", "", a.context),
              node("div", "attention-action", a.action),
            );
            if (a.status === "deferred")
              card.append(
                node(
                  "p",
                  "",
                  "Deferred until " +
                    a.until +
                    (Date.parse(a.until) <= Date.parse(data.generatedAt)
                      ? " · due now"
                      : ""),
                ),
              );
            card.title = a.source;
            panel.append(card);
          }
          if (!list.length)
            panel.append(
              empty(
                data.sources.find((s) => s.name === "Attention")?.status ===
                  "ok"
                  ? "No unanswered obligations recorded."
                  : "Attention history unavailable; obligations unknown.",
              ),
            );
          panel.append(
            node(
              "div",
              "panel-footer",
              "Viewing never presents, resolves, or acknowledges an obligation.",
            ),
          );
          return panel;
        }
        function timeline(limit) {
          const panel = node("div", "panel timeline"),
            events = data.events
              .filter((e) => matches(e.title, e.detail, e.kind))
              .slice(0, limit);
          for (const e of events) {
            const row = node("div", "event"),
              info = node("div");
            info.append(
              node("div", "event-title", e.title),
              node("div", "event-detail", e.detail),
            );
            row.append(
              node("span", "event-dot " + e.kind),
              info,
              node("time", "event-time", age(e.at)),
            );
            row.id = "event-" + e.id;
            row.title = e.at + "\n" + e.source + "\n" + e.detail;
            panel.append(row);
          }
          if (!events.length)
            panel.append(
              empty(
                "No recorded events. Reports and decisions will appear with their source.",
              ),
            );
          return panel;
        }
        function sourcesPanel() {
          const panel = node("div", "panel");
          for (const s of data.sources) {
            const row = node("div", "source-row");
            row.append(
              node("strong", "", s.name + " "),
              pill(s.status, s.status === "ok" ? "accepted" : "warning"),
              node("div", "source-path", s.path),
              node(
                "div",
                "",
                "Read " +
                  (s.observedAt || "unknown") +
                  " · Modified " +
                  (s.modifiedAt || "unknown"),
              ),
              node("div", s.status === "ok" ? "" : "diagnostic", s.detail),
            );
            panel.append(row);
          }
          for (const d of data.diagnostics)
            panel.append(node("p", "diagnostic", d));
          return panel;
        }
        function render() {
          if (!data) return;
          const active = document.activeElement,
            focusId = active?.id;
          const root = node("main", "page");
          root.id = "main";
          $("mode").textContent = data.demo
            ? "Synthetic demo · no live commands"
            : "Local files · refresh every 5s";
          $("crumb").textContent = view[0].toUpperCase() + view.slice(1);
          for (const b of document.querySelectorAll("[data-view]")) {
            if (b.dataset.view === view) b.setAttribute("aria-current", "page");
            else b.removeAttribute("aria-current");
          }
          const hero = node("div", "hero"),
            intro = node("div");
          intro.append(
            node(
              "div",
              "eyebrow",
              data.demo
                ? "Synthetic session / Observatory demo"
                : "Local session / " + data.session,
            ),
            node(
              "h1",
              "",
              view === "overview"
                ? "A clear view of the work."
                : {
                    agents: "The people behind the progress.",
                    activity: "Every change, in context.",
                    evidence: "Claims meet their evidence.",
                    sources: "Trust starts at the source.",
                  }[view],
            ),
            node(
              "p",
              "",
              "Agents, evidence, and the decisions that move work forward.",
            ),
          );
          const status = node("div", "live-status"),
            live = data.sources.find((s) => s.name === "Herdr");
          const line = node("div");
          line.append(
            node("span", "dot"),
            node(
              "span",
              "",
              live?.status === "ok"
                ? "Observations refreshed"
                : "Live status unavailable",
            ),
          );
          status.append(
            line,
            node(
              "div",
              "",
              "Updated " +
                new Date(data.generatedAt).toLocaleTimeString([], {
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit",
                }),
            ),
          );
          hero.append(intro, status);
          root.append(hero);
          if (data.diagnostics.length)
            root.append(
              node(
                "div",
                "notice",
                data.diagnostics.length +
                  " source notice" +
                  (data.diagnostics.length === 1 ? "" : "s") +
                  " · Some observations are unavailable. Inspect Sources for provenance and recovery details.",
              ),
            );
          if (view === "overview") {
            const stats = node("div", "stats");
            for (const [label, value, caption, symbol] of [
              [
                "Working now",
                data.agents.filter(
                  (a) => a.activity === "working" && a.freshness === "fresh",
                ).length,
                "Fresh live observations",
                "◎",
              ],
              [
                "Awaiting verification",
                data.tasks.filter((t) => t.stage === "awaiting verification")
                  .length,
                "Claims pending assessment",
                "◷",
              ],
              [
                "Recorded acceptance",
                data.tasks.filter((t) => t.stage === "accepted").length,
                "Assignments with matching evidence",
                "✓",
              ],
              [
                "Needs attention",
                data.attention.filter(
                  (a) =>
                    a.status === "open" ||
                    Date.parse(a.until) <= Date.parse(data.generatedAt),
                ).length,
                "Unanswered or due obligations",
                "◇",
              ],
            ]) {
              const stat = node("div", "stat"),
                top = node("div", "top", label);
              top.append(node("span", "symbol", symbol));
              stat.append(
                top,
                node("div", "value", value),
                node("div", "caption", caption),
              );
              stats.append(stat);
            }
            root.append(stats);
            const layout = node("div", "layout"),
              left = node("div"),
              right = node("div");
            left.append(
              section(
                "Agent activity",
                data.agents.length + " observed",
                agentsPanel(),
              ),
              section(
                "Work in motion",
                "Assignment status · not task completion",
                board(),
              ),
              section(
                "Recent activity",
                "Newest observations first",
                timeline(5),
              ),
            );
            const ev = node("div", "panel");
            for (const e of data.evidence.slice(0, 4))
              ev.append(evidenceButton(e));
            if (!data.evidence.length) ev.append(empty("No evidence indexed."));
            const health = node("div", "panel watcher");
            health.append(node("span", "", "⌁"), node("div", "", data.watcher));
            right.append(
              section(
                "Operator attention",
                data.attention.length + " recorded",
                attentionPanel(),
              ),
              section("Evidence library", "Local artifacts", ev),
              section("Supervision", "Saved health", health),
            );
            layout.append(left, right);
            root.append(layout);
          } else if (view === "agents") {
            root.append(
              section(
                "Agent activity",
                "Elapsed time is since recorded dispatch",
                agentsPanel(),
              ),
              section(
                "Assignment board",
                data.tasks.length + " assignments",
                board(),
              ),
            );
          } else if (view === "activity") {
            root.append(
              section(
                "Event timeline",
                "Up to 500 events · timestamps then stream sequence",
                timeline(500),
              ),
            );
          } else if (view === "evidence") {
            const p = node("div", "panel");
            for (const e of data.evidence.filter((e) =>
              matches(e.title, e.path),
            ))
              p.append(evidenceButton(e));
            if (!p.childNodes.length) p.append(empty("No matching evidence."));
            root.append(
              section(
                "Evidence library",
                "Report presence never proves acceptance",
                p,
              ),
            );
            if (data.ledger) {
              const d = node("details", "panel");
              d.id = "ledger-context";
              d.append(
                node(
                  "summary",
                  "source-row",
                  "TASK-LEDGER.md · narrative context",
                ),
                data.ledgerMarkdown
                  ? markdownView(data.ledgerMarkdown)
                  : node("pre", "source-row", data.ledger),
              );
              root.append(section("Task ledger", "Not used for status", d));
            }
            const beans = node("div", "panel");
            for (const b of data.beans)
              beans.append(
                node("div", "source-row", b.title + " · " + b.status),
              );
            if (!data.beans.length)
              beans.append(empty("No Beans issues indexed."));
            root.append(
              section(
                "Beans issues",
                "Workflow context · not acceptance",
                beans,
              ),
            );
          } else
            root.append(
              section(
                "Source provenance",
                "Passive reads only; no owner migrations",
                sourcesPanel(),
              ),
            );
          const foot = node("div", "footer");
          foot.append(
            node(
              "span",
              "",
              "Local content stays local. No remote assets or analytics.",
            ),
            node("span", "", "/ Search · 1–5 Views · Esc Close"),
          );
          root.append(foot);
          window.morphdom($("main"), root, {
            childrenOnly: true,
            onBeforeElUpdated(from, to) {
              from.onclick = to.onclick;
              if (from.tagName === "DETAILS" && from.open)
                to.setAttribute("open", "");
              return true;
            },
          });
          if (focusId && $(focusId) && document.activeElement !== active)
            $(focusId).focus();
        }
        window.observatory = {
          configure(config) {
            for (const key of ["project", "session"]) {
              const values =
                key === "project" ? config.projects : config.sessions;
              $(key).replaceChildren(
                ...values.map((v) => {
                  const o = node(
                    "option",
                    "",
                    key === "project" ? short(v) : v,
                  );
                  o.value = v;
                  o.title = v;
                  return o;
                }),
              );
            }
          },
          snapshot(snapshot) {
            data = snapshot;
            $("connection").textContent = "Observations refreshed";
            render();
          },
          evidence(payload) {
            if (selectedEvidence !== payload.id) return;
            const body = $("drawer-body");
            body.replaceChildren();
            if (payload.error) {
              body.append(node("p", "diagnostic", payload.error));
              return;
            }
            body.append(
              node("div", "source-path", payload.path),
              pill(
                payload.integrity,
                payload.integrity === "matched" ? "accepted" : "warning",
              ),
              node(
                "div",
                "source-path",
                "Read " + payload.readAt + " · SHA-256 " + payload.actualSha256,
              ),
            );
            if (payload.image) {
              const img = node("img");
              img.src = payload.image;
              img.alt = payload.title;
              body.append(img);
            } else {
              if (payload.markdown) {
                const toolbar = node("div", "markdown-toolbar"),
                  content = node("div");
                const rendered = button("Rendered", "primary", () => {
                  content.replaceChildren(markdownView(payload.markdown));
                  rendered.setAttribute("aria-pressed", "true");
                  source.setAttribute("aria-pressed", "false");
                });
                const source = button("Source", "primary", () => {
                  content.replaceChildren(
                    node("pre", "markdown-source", payload.text),
                  );
                  source.setAttribute("aria-pressed", "true");
                  rendered.setAttribute("aria-pressed", "false");
                });
                rendered.setAttribute("aria-pressed", "true");
                source.setAttribute("aria-pressed", "false");
                toolbar.setAttribute("role", "group");
                toolbar.setAttribute("aria-label", "Report appearance");
                toolbar.append(rendered, source);
                content.append(markdownView(payload.markdown));
                body.append(toolbar, content);
              } else body.append(node("pre", "", payload.text));
            }
          },
          notice(message) {
            $("toast").textContent = message;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => ($("toast").textContent = ""), 6000);
          },
        };
        for (const b of document.querySelectorAll("[data-view]"))
          b.onclick = () => {
            view = b.dataset.view;
            render();
          };
        $("search").oninput = (e) => {
          query = e.target.value.toLowerCase();
          render();
        };
        $("theme").onchange = (e) => {
          if (e.target.value === "system")
            delete document.documentElement.dataset.theme;
          else document.documentElement.dataset.theme = e.target.value;
        };
        for (const key of ["project", "session"])
          $(key).onchange = () => {
            if (!$("drawer").hidden) closeDrawer();
            send({
              action: "select",
              project: $("project").value,
              session: $("session").value,
            });
          };
        $("refresh").onclick = () => send({ action: "refresh" });
        $("close").onclick = closeDrawer;
        document.addEventListener("keydown", (e) => {
          if (!$("drawer").hidden) {
            if (e.key === "Escape") {
              e.preventDefault();
              closeDrawer();
            }
            if (e.key === "Tab") {
              const focusable = [
                ...$("drawer").querySelectorAll(
                  'button:not(:disabled),[tabindex="0"]',
                ),
              ];
              const first = focusable[0],
                last = focusable.at(-1);
              if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last.focus();
              } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
              }
            }
            return;
          }
          if (
            ["INPUT", "SELECT", "TEXTAREA"].includes(
              document.activeElement.tagName,
            )
          )
            return;
          if (e.key === "/") {
            e.preventDefault();
            $("search").focus();
          }
          if (/^[1-5]$/.test(e.key)) {
            view = ["overview", "agents", "activity", "evidence", "sources"][
              Number(e.key) - 1
            ];
            render();
          }
        });
        send({ action: "ready" });
      })();
    </script>
  </body>
</html>
